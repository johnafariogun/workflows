name: Inventory Service CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Stage 1: Matrix tests (reusable)
  tests:
    uses: johnafariogun/playbook/.github/workflows/go-matrix-test.yml@main
    with:
      working-directory: "."
    # secrets:
    #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: Docker build & push (reusable)
  docker:
    needs: tests
    uses: johnafariogun/playbook/.github/workflows/build-and-push-image.yml@main
    with:
      image-name: ghcr.io/johnafariogun/inventory-service:${{ github.sha }}
      working-directory: "."
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3: Deploy to Kubernetes (reusable)
  deploy-staging:
    needs: docker
    if: github.ref == 'refs/heads/main'
    uses: johnafariogun/playbook/.github/workflows/deploy-k8s.yml@main
    with:
      image: ghcr.io/johnafariogun/inventory-service:${{ github.sha }}
      namespace: inventory-staging
      deployment: inventory-service
    secrets:
      KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_STAGING }}
      # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Slack notifications for main branch (after deploy) — runs regardless of success/failure
  notify-main:
    needs: deploy-staging
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify on success
        if: ${{ success() }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ Deployment successful: ${{ github.repository }}\nImage: ghcr.io/johnafariogun/inventory-service:${{ github.sha }}\nBranch: ${{ github.ref_name }}"

      - name: Notify on failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ Deployment failed: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nRun: ${{ github.run_number }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Slack notifications for non-main refs (e.g. PRs) — run after tests/docker
  notify-other:
    needs: [tests, docker]
    if: ${{ always() && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ CI failed for ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nRun: ${{ github.run_number }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"