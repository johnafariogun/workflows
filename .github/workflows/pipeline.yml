name: Inventory Service CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Stage 1: Matrix tests (reusable)
  tests:
    uses: johnafariogun/playbook/.github/workflows/go-matrix-test.yml@main
    with:
      working-directory: "."
    # secrets:
    #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: Docker build & push (reusable)
  docker:
    needs: tests
    uses: johnafariogun/playbook/.github/workflows/build-and-push-image.yml@main
    with:
      image-name: ghcr.io/johnafariogun/inventory-service:${{ github.sha }}
      working-directory: "."
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3: Deploy to Kubernetes (reusable)
  deploy-staging:
    needs: docker
    if: github.ref == 'refs/heads/main'
    uses: johnafariogun/playbook/.github/workflows/deploy-k8s.yml@main
    with:
      image: ghcr.io/johnafariogun/inventory-service:${{ github.sha }}
      namespace: inventory-staging
      deployment: inventory-service
    secrets:
      KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_STAGING }}
      # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  notify-success:
    needs: deploy-staging
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Post a message in a channel
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub Action build result*: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action build result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"

  # Slack notification on failure
  notify-failure:
    needs: deploy-staging
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Post a message in a channel
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub Action build result*: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action build result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"